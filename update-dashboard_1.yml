name: Update Dashboard Data

# Fires automatically whenever data/All_Projects.xlsx changes on main —
# which happens the moment Zapier commits the new weekly export.
# workflow_dispatch lets you also trigger it by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "data/All_Projects.xlsx"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Parse Excel into dashboard data.json
        run: python scripts/parse_projects.py data/All_Projects.xlsx data.json

      - name: Commit updated data.json and version history
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json data/history
          git diff --cached --quiet || git commit -m "Auto-update dashboard data $(date -u +%Y-%m-%d)"
          git push
