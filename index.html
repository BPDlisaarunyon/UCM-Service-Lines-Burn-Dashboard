<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCM Service Lines — Budget Burn Down</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #800000;   /* UCM "Phoenix Maroon" - primary / allocated */
    --seq-100:        #f1dede;
    --seq-450:        #9c3a3a;
    --seq-600:        #5c0000;
    --bpd-ink:         #1c1c1a;  /* BPD charcoal */
    --status-good:    #0ca30c;
    --status-warning: #fab219;
    --status-serious: #ec835a;
    --status-critical:#d03b3b;
    --success-text:   #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #c24545;
      --seq-100:        #5c0000;
      --seq-450:        #c24545;
      --seq-600:        #e79c9c;
      --bpd-ink:         #0d0d0d;
      --status-good:    #0ca30c;
      --status-warning: #fab219;
      --status-serious: #ec835a;
      --status-critical:#d03b3b;
      --success-text:   #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #c24545;
    --seq-100:        #5c0000;
    --seq-450:        #c24545;
    --seq-600:        #e79c9c;
    --bpd-ink:         #0d0d0d;
    --status-good:    #0ca30c;
    --status-warning: #fab219;
    --status-serious: #ec835a;
    --status-critical:#d03b3b;
    --success-text:   #0ca30c;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
  }
  .viz-root { padding: 0 0 48px; max-width: 1120px; margin: 0 auto; }

  .masthead {
    background: var(--series-1);
    color: #ffffff;
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .masthead .client-mark { display: flex; align-items: center; gap: 10px; }
  .masthead .client-mark .crest {
    width: 30px; height: 30px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.55);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;
    letter-spacing: .02em;
  }
  .masthead .client-mark .name { font-weight: 700; font-size: 15px; letter-spacing: .01em; }
  .masthead .client-mark .name small { display: block; font-weight: 500; font-size: 11px; opacity: .85; letter-spacing: .04em; text-transform: uppercase; margin-top: 1px; }
  .masthead .agency-credit {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .9;
    display: flex; align-items: center; gap: 8px;
  }
  .masthead .agency-credit .agency-mark {
    background: var(--bpd-ink); color: #fff; font-weight: 800; font-size: 11px;
    padding: 4px 8px; border-radius: 5px; letter-spacing: .04em;
  }

  .content-pad { padding: 0 32px; }

  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .titles h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .titles .sub { font-size: 13px; color: var(--text-secondary); margin: 0; }
  .titles .sub b { color: var(--text-primary); font-weight: 600; }

  .theme-toggle {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .theme-toggle:hover { color: var(--text-primary); }

  .meta-row { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); margin-bottom: 28px; }
  .meta-row span b { color: var(--text-secondary); font-weight: 600; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  @media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px;
  }
  .tile .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 8px; }
  .tile .value { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .tile .note { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
  .tile.accent .value { color: var(--series-1); }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 22px; margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  .card .card-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 16px; }

  /* Burn meter */
  .meter-track {
    position: relative; height: 22px; border-radius: 11px; background: var(--gridline);
    overflow: hidden; margin-bottom: 10px;
  }
  .meter-fill {
    position: absolute; top: 0; left: 0; height: 100%; border-radius: 11px;
    background: linear-gradient(90deg, var(--seq-450), var(--seq-600));
  }
  .meter-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); }
  .meter-labels b { color: var(--text-primary); }
  .pace-note { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; }
  .pace-badge {
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .03em;
  }
  .pace-badge.good    { background: color-mix(in srgb, var(--status-good) 16%, transparent); color: var(--status-good); }
  .pace-badge.warning { background: color-mix(in srgb, var(--status-warning) 20%, transparent); color: #8a6200; }
  .pace-badge.serious { background: color-mix(in srgb, var(--status-serious) 18%, transparent); color: #a1481f; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .03em;
    color: var(--text-muted); font-weight: 600; padding: 0 10px 8px; border-bottom: 1px solid var(--gridline);
  }
  tbody td { padding: 11px 10px; border-bottom: 1px solid var(--gridline); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.proj-name { font-weight: 600; color: var(--text-primary); }
  td.proj-id { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .status-badge {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 6px;
    border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap;
  }
  .status-badge.inprogress { color: var(--series-1); border-color: color-mix(in srgb, var(--series-1) 40%, transparent); }
  .status-badge.onhold { color: #8a6200; border-color: color-mix(in srgb, var(--status-warning) 50%, transparent); }
  .status-badge.completed { color: var(--text-muted); }

  .empty-note { font-size: 13px; color: var(--text-muted); padding: 6px 10px; }

  .av-card { border: 1px dashed color-mix(in srgb, var(--series-1) 50%, transparent); background: color-mix(in srgb, var(--series-1) 5%, var(--surface-1)); }
  .av-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .av-tag { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--series-1); background: color-mix(in srgb, var(--series-1) 14%, transparent); padding: 3px 9px; border-radius: 999px; margin-bottom: 8px; }

  .footnote { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
  .footnote b { color: var(--text-secondary); }
  .foot-card { background: transparent; border: 1px dashed var(--border); }

  .section-title-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .count-chip {
    font-size: 11px; color: var(--text-muted); background: var(--page-plane); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 999px;
  }

  .warn-banner {
    background: color-mix(in srgb, var(--status-warning) 16%, var(--surface-1));
    border: 1px solid color-mix(in srgb, var(--status-warning) 50%, transparent);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px; color: var(--text-secondary);
    display: none;
  }
  .warn-banner.show { display: block; }
  .warn-banner b { color: var(--text-primary); }
  .warn-banner ul { margin: 6px 0 0; padding-left: 18px; }

  .load-state { padding: 60px 32px; text-align: center; color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>
<div class="viz-root" id="vizRoot">
  <div class="masthead">
    <div class="client-mark">
      <div class="crest">UC</div>
      <div class="name">UChicago Medicine<small>University of Chicago Medical Center</small></div>
    </div>
    <div class="agency-credit">Prepared by <span class="agency-mark">BPD</span> Healthcare</div>
  </div>

  <div class="content-pad" id="contentPad">
    <div class="load-state" id="loadState">Loading dashboard data…</div>
  </div>
</div>

<script>
  const fmt$ = n => '$' + Math.round(n).toLocaleString('en-US');
  const fmtPct = n => (Math.round(n * 10) / 10) + '%';

  function statusBadgeClass(status) {
    const s = (status || '').toLowerCase();
    if (s.includes('progress')) return 'inprogress';
    if (s.includes('hold') || s.includes('estimating')) return 'onhold';
    return 'completed';
  }

  function renderRow(p) {
    return `<tr>
      <td><div class="proj-name">${p.name}</div><div class="proj-id">${p.id}</div></td>
      <td><span class="status-badge ${statusBadgeClass(p.status)}">${p.status}</span></td>
      <td>${p.type}</td>
      <td class="num">${fmt$(p.budget)}</td>
    </tr>`;
  }

  function buildShell() {
    document.getElementById('contentPad').innerHTML = `
      <div class="top-bar">
        <div class="titles">
          <h1>UCM Service Lines — Client Budget Burn Down</h1>
          <p class="sub">Campaign: <b id="campaignName">—</b> &nbsp;·&nbsp; Client: <b>UChicago Medicine (UCMC)</b></p>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button">Dark mode</button>
      </div>

      <div class="warn-banner" id="warnBanner">
        <b id="warnHeadline"></b>
        <ul id="warnList"></ul>
      </div>

      <div class="meta-row">
        <span>Last updated: <b id="lastUpdated"></b></span>
        <span>Scope end: <b id="scopeEnd"></b></span>
        <span>Data source: <b>All Projects export</b></span>
        <span id="asOfDays"></span>
      </div>

      <div class="tiles">
        <div class="tile">
          <div class="label">Total Client Budget</div>
          <div class="value" id="tileTotal">$0</div>
          <div class="note">Fixed scope budget</div>
        </div>
        <div class="tile accent">
          <div class="label">Allocated to Projects</div>
          <div class="value" id="tileAllocated">$0</div>
          <div class="note" id="tileAllocatedPct">0% of total</div>
        </div>
        <div class="tile">
          <div class="label">Remaining Budget</div>
          <div class="value" id="tileRemaining">$0</div>
          <div class="note" id="tileRemainingPct">0% of total</div>
        </div>
        <div class="tile">
          <div class="label">Run-Rate to Fully Use by Scope End</div>
          <div class="value" id="tileRunRate">$0<span style="font-size:13px;font-weight:600;color:var(--text-secondary);">/wk</span></div>
          <div class="note" id="tileRunRateNote">based on weeks remaining</div>
        </div>
      </div>

      <div class="card">
        <h2>Budget Burn Down</h2>
        <p class="card-sub" id="meterSub">Allocated (sum of current project budgets) against the fixed client budget for this campaign.</p>
        <div class="meter-track">
          <div class="meter-fill" id="meterFill" style="width:0%"></div>
        </div>
        <div class="meter-labels">
          <span><b id="meterAllocatedLabel">$0</b> allocated</span>
          <span><b id="meterRemainingLabel">$0</b> remaining of <span id="meterTotalLabel">$0</span></span>
        </div>
        <div class="pace-note">
          <span class="pace-badge" id="paceBadge">—</span>
          <span id="paceText" style="color:var(--text-secondary);"></span>
        </div>
      </div>

      <div class="card">
        <div class="section-title-row"><h2>Active Projects</h2><span class="count-chip" id="activeCount">0</span></div>
        <p class="card-sub">In-progress and on-hold projects currently drawing against the budget.</p>
        <table>
          <thead><tr>
            <th>Project</th><th>Status</th><th>Type</th>
            <th class="num">Budget</th>
          </tr></thead>
          <tbody id="activeBody"></tbody>
        </table>
      </div>

      <div class="card av-card">
        <div class="section-title-row" style="margin-bottom:14px;">
          <div class="av-tag" style="margin-bottom:0;">Added Value</div>
          <span class="count-chip" id="addedValueCount">0</span>
        </div>
        <p class="card-sub" style="margin-bottom:14px;">Delivered outside the client budget — excluded from the burn-down calculation above.</p>
        <div id="addedValueBody"></div>
        <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:13px;color:var(--text-secondary);">
          Total value delivered at no cost to the budget: <b id="addedValueTotal" style="color:var(--series-1);">$0</b>
        </div>
      </div>

      <div class="card">
        <div class="section-title-row"><h2>Completed Projects</h2><span class="count-chip" id="completedCount">0</span></div>
        <p class="card-sub">Projects remain visible here after closing — their budget stays counted in the burn down.</p>
        <table>
          <thead><tr>
            <th>Project</th><th>Status</th><th>Type</th>
            <th class="num">Budget</th>
          </tr></thead>
          <tbody id="completedBody"></tbody>
        </table>
      </div>

      <div class="card foot-card footnote">
        <b>Scope of this dashboard:</b> pulls only the campaign named above from the weekly projects export, using each project's Current Total Budget. Which bucket a project falls into — Active, Completed, Added Value, or excluded entirely (media buys/labor, sales-pipeline records, zero-budget admin rows) — is set by the <code>Dashboard Bucket</code> column in the source spreadsheet, not guessed from the project type. <span id="excludedNote"></span>
        <br><br>
        <b>This dashboard updates itself:</b> the weekly Excel export is routed by Zapier into this repository, a GitHub Action re-reads it and rebuilds <code>data.json</code>, and this page re-fetches that file on every load. Nothing here needs manual edits — classification changes happen in the spreadsheet's Dashboard Bucket column.
      </div>
    `;
    document.getElementById('themeToggle').addEventListener('click', () => {
      const root = document.documentElement;
      const isDark = root.getAttribute('data-theme') === 'dark';
      root.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeToggle').textContent = isDark ? 'Dark mode' : 'Light mode';
    });
  }

  function render(cfg) {
    const PROJECTS = cfg.projects || [];
    const TOTAL_BUDGET = cfg.totalBudget;
    const SCOPE_END = cfg.scopeEnd;
    const LAST_UPDATED = cfg.lastUpdated;

    document.getElementById('campaignName').textContent = cfg.campaign || '—';

    if (cfg.warnings && cfg.warnings.length) {
      const banner = document.getElementById('warnBanner');
      banner.classList.add('show');
      document.getElementById('warnHeadline').textContent =
        `${cfg.warnings.length} row(s) in this campaign need a Dashboard Bucket value and were left off this dashboard:`;
      document.getElementById('warnList').innerHTML = cfg.warnings.map(w => `<li>${w}</li>`).join('');
    }

    if (typeof cfg.excludedCount === 'number') {
      document.getElementById('excludedNote').textContent =
        ` ${cfg.excludedCount} row(s) are currently marked Exclude (totaling ${fmt$(cfg.excludedBudget || 0)}) and are not part of the burn calculation.`;
    }

    const burnable = PROJECTS.filter(p => !p.addedValue);
    const addedValue = PROJECTS.filter(p => p.addedValue);
    const active = burnable.filter(p => p.lifecycle === 'active');
    const completed = burnable.filter(p => p.lifecycle === 'completed');

    const allocated = burnable.reduce((s, p) => s + (p.budget || 0), 0);
    const remaining = TOTAL_BUDGET - allocated;
    const pctAllocated = (allocated / TOTAL_BUDGET) * 100;
    const pctRemaining = 100 - pctAllocated;

    document.getElementById('tileTotal').textContent = fmt$(TOTAL_BUDGET);
    document.getElementById('tileAllocated').textContent = fmt$(allocated);
    document.getElementById('tileAllocatedPct').textContent = fmtPct(pctAllocated) + ' of total';
    document.getElementById('tileRemaining').textContent = fmt$(remaining);
    document.getElementById('tileRemainingPct').textContent = fmtPct(pctRemaining) + ' of total';

    document.getElementById('meterFill').style.width = Math.min(100, Math.max(0, pctAllocated)) + '%';
    document.getElementById('meterAllocatedLabel').textContent = fmt$(allocated) + ' (' + fmtPct(pctAllocated) + ')';
    document.getElementById('meterRemainingLabel').textContent = fmt$(remaining);
    document.getElementById('meterTotalLabel').textContent = fmt$(TOTAL_BUDGET);

    const now = new Date();
    const end = new Date(SCOPE_END + 'T00:00:00');
    const msPerDay = 1000 * 60 * 60 * 24;
    const daysRemaining = Math.max(0, Math.round((end - now) / msPerDay));
    const weeksRemaining = daysRemaining / 7;
    const monthsRemaining = daysRemaining / 30.44;

    document.getElementById('scopeEnd').textContent = end.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    document.getElementById('lastUpdated').textContent = new Date(LAST_UPDATED + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    document.getElementById('asOfDays').innerHTML = daysRemaining > 0
      ? `<b>${daysRemaining.toLocaleString()}</b> days (~${Math.round(weeksRemaining)} wks) remaining in scope`
      : `<b>Scope end reached</b>`;

    const weeklyRunRate = weeksRemaining > 0 ? remaining / weeksRemaining : remaining;
    document.getElementById('tileRunRate').innerHTML = fmt$(weeklyRunRate) + '<span style="font-size:13px;font-weight:600;color:var(--text-secondary);">/wk</span>';
    document.getElementById('tileRunRateNote').textContent = `≈ ${fmt$(remaining / (monthsRemaining || 1))}/mo to fully allocate by scope end`;

    const paceBadge = document.getElementById('paceBadge');
    const paceText = document.getElementById('paceText');
    if (remaining <= 0) {
      paceBadge.textContent = 'Fully Allocated';
      paceBadge.className = 'pace-badge good';
      paceText.textContent = 'The full client budget has been allocated to projects.';
    } else if (daysRemaining <= 0) {
      paceBadge.textContent = 'Scope Ended';
      paceBadge.className = 'pace-badge serious';
      paceText.textContent = fmt$(remaining) + ' was never allocated before the scope end date.';
    } else {
      paceBadge.textContent = 'On Track';
      paceBadge.className = 'pace-badge good';
      paceText.textContent = `${fmt$(remaining)} remains unallocated with ${daysRemaining.toLocaleString()} days left in scope — plan new project budgets against this runway.`;
    }

    document.getElementById('activeCount').textContent = active.length;
    document.getElementById('completedCount').textContent = completed.length;
    document.getElementById('activeBody').innerHTML = active.length
      ? active.map(renderRow).join('')
      : '<tr><td colspan="4" class="empty-note">No active projects.</td></tr>';
    document.getElementById('completedBody').innerHTML = completed.length
      ? completed.map(renderRow).join('')
      : '<tr><td colspan="4" class="empty-note">No completed projects yet.</td></tr>';

    document.getElementById('addedValueCount').textContent = addedValue.length;
    document.getElementById('addedValueBody').innerHTML = addedValue.length
      ? addedValue.map((p, i) => `
          <div class="av-row" style="${i > 0 ? 'margin-top:14px;padding-top:14px;border-top:1px solid var(--border);' : ''}">
            <div>
              <div class="proj-name" style="font-size:15px;">${p.name}</div>
              <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${p.type} &nbsp;·&nbsp; ${p.id}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:6px;">Status: <span class="status-badge ${statusBadgeClass(p.status)}">${p.status}</span></div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:20px;font-weight:700;color:var(--series-1);">${fmt$(p.budget)}</div>
              <div style="font-size:11px;color:var(--text-muted);">not counted against budget</div>
            </div>
          </div>`).join('')
      : '<div class="empty-note">No added-value items.</div>';
    document.getElementById('addedValueTotal').textContent = fmt$(addedValue.reduce((s, p) => s + (p.budget || 0), 0));
  }

  async function init() {
    try {
      const res = await fetch('./data.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(`data.json returned ${res.status}`);
      const cfg = await res.json();
      buildShell();
      render(cfg);
    } catch (err) {
      document.getElementById('contentPad').innerHTML = `
        <div class="load-state">
          Couldn't load <code>data.json</code> (${err.message}).<br>
          Make sure it exists alongside this page and the latest GitHub Action run succeeded.
        </div>`;
    }
  }

  init();
</script>
</body>
</html>
